<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>访问统计后台 · 程轶婧律师个人网站</title>
<style>
  :root{
    --bg:#0b1f3a; --panel:#12294d; --panel2:#0e2244; --line:#1e3a66;
    --text:#e8eef8; --muted:#8ba3c4; --accent:#c9a35c;
    --blue:#3b82f6; --green:#22c55e; --gold:#eab308; --red:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#07162e 0%,#0b1f3a 50%,#0a1830 100%);
    color:var(--text); min-height:100vh; padding:32px 20px;
  }
  .wrap{max-width:960px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:28px}
  h1{font-size:22px;font-weight:700;letter-spacing:.5px}
  h1 .dot{color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-top:6px}
  .refresh-btn{
    background:var(--accent);color:#0b1f3a;border:none;padding:10px 18px;border-radius:8px;
    font-weight:600;font-size:14px;cursor:pointer;transition:.2s
  }
  .refresh-btn:hover{opacity:.9}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;
    position:relative;overflow:hidden
  }
  .card .label{color:var(--muted);font-size:13px;margin-bottom:10px}
  .card .num{font-size:36px;font-weight:800;letter-spacing:-.5px}
  .card .hint{color:var(--muted);font-size:12px;margin-top:8px}
  .card.total .num{color:var(--blue)}
  .card.bot .num{color:var(--gold)}
  .card.human .num{color:var(--green)}
  .card::after{content:"";position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.03)}
  .section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:20px}
  .section h2{font-size:16px;font-weight:700;margin-bottom:16px;color:#fff}
  .section h2 .badge{font-size:12px;font-weight:500;color:var(--muted);margin-left:8px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px}
  td{color:var(--text)}
  tr:last-child td{border-bottom:none}
  .tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
  .tag.bot{background:rgba(234,179,8,.15);color:var(--gold)}
  .tag.human{background:rgba(34,197,94,.15);color:var(--green)}
  .empty{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}
  .config-tip{
    background:rgba(201,163,92,.1);border:1px solid rgba(201,163,92,.3);border-radius:12px;
    padding:18px 20px;margin-bottom:24px;font-size:13px;line-height:1.7;color:#e8dcc0
  }
  .config-tip code{background:rgba(0,0,0,.3);padding:2px 6px;border-radius:4px;font-size:12px}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
  .loading{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>访问统计<span class="dot">·</span>后台</h1>
      <div class="sub">程轶婧律师个人网站 · 数据来自 Supabase</div>
    </div>
    <button class="refresh-btn" onclick="load()">刷新数据</button>
  </header>

  <div class="config-tip" id="configTip" style="display:none">
    <strong>尚未配置 Supabase：</strong>请打开本文件，把 <code>SUPABASE_URL</code> 和 <code>SUPABASE_ANON_KEY</code> 替换成你的真实值（与 index.html 中的配置一致），然后重新部署本文件即可。
  </div>

  <div class="cards">
    <div class="card total">
      <div class="label">总访问量</div>
      <div class="num" id="totalNum">—</div>
      <div class="hint">全部访问请求</div>
    </div>
    <div class="card bot">
      <div class="label">机器抓取</div>
      <div class="num" id="botNum">—</div>
      <div class="hint">搜索引擎 / AI 爬虫</div>
    </div>
    <div class="card human">
      <div class="label">真人浏览</div>
      <div class="num" id="humanNum">—</div>
      <div class="hint">非爬虫访问（约 80-90% 准确）</div>
    </div>
  </div>

  <div class="section">
    <h2>访客类型明细 <span class="badge">按 User-Agent 分类</span></h2>
    <div id="botList"><div class="loading">加载中…</div></div>
  </div>

  <div class="section">
    <h2>最近访问记录 <span class="badge">最新 20 条</span></h2>
    <div id="recentList"><div class="loading">加载中…</div></div>
  </div>

  <div class="foot">本页面仅供站主查看 · 已设置 noindex 不会被搜索引擎收录</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL = "https://hjvqbxfhflkgssmflnlm.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_AAt0wVjl8D9DZELU6usF5g_IFUH2fjN";

function isConfigured(){
  return SUPABASE_URL && SUPABASE_URL.indexOf('YOUR-PROJECT') === -1 &&
         SUPABASE_ANON_KEY && SUPABASE_ANON_KEY.indexOf('YOUR-ANON-KEY') === -1;
}

function shortUA(ua){
  if(!ua) return '未知';
  ua = ua || '';
  var map = [
    ['Googlebot','Google 爬虫'],['Bingbot','Bing 爬虫'],['Bytespider','字节跳动爬虫(豆包)'],
    ['GPTBot','OpenAI 爬虫(ChatGPT)'],['Claude','Claude 爬虫'],['Perplexity','Perplexity 爬虫'],
    ['Baiduspider','百度爬虫'],['360Spider','360 爬虫'],['Sogou','搜狗爬虫'],
    ['facebookexternalhit','Facebook'],['WhatsApp','WhatsApp'],
    ['Chrome','Chrome 浏览器'],['Safari','Safari 浏览器'],['Firefox','Firefox 浏览器'],
    ['Edg','Edge 浏览器'],['MicroMessenger','微信内置浏览器'],['SogouMobileBrowser','搜狗浏览器']
  ];
  for(var i=0;i<map.length;i++){ if(ua.indexOf(map[i][0]) !== -1) return map[i][1]; }
  return ua.slice(0,30);
}

function fmtTime(iso){
  if(!iso) return '';
  var d = new Date(iso);
  var p = function(n){ return n<10?'0'+n:''+n; };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

async function load(){
  if(!isConfigured()){
    document.getElementById('configTip').style.display = 'block';
    document.getElementById('botList').innerHTML = '<div class="empty">请先配置 Supabase</div>';
    document.getElementById('recentList').innerHTML = '<div class="empty">请先配置 Supabase</div>';
    return;
  }
  document.getElementById('configTip').style.display = 'none';

  try{
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 总数
    var cnt = await sb.from('visits').select('*', { count:'exact', head:true });
    var total = cnt.count || 0;

    // 分类统计（拉全部记录，分类在客户端做，避免依赖 SQL）
    var all = await sb.from('visits').select('category,user_agent,created_at,page').order('created_at', { ascending:false }).limit(1000);
    var rows = all.data || [];

    var botCount = 0, humanCount = 0;
    var botMap = {};
    rows.forEach(function(r){
      if(r.category === 'bot'){ botCount++; } else { humanCount++; }
    });

    // 注意：如果记录超过 1000 条，分类统计会不完整，但作为趋势参考足够
    // 用 total 作为总访问量（准确），bot/human 用最近 1000 条估算比例
    document.getElementById('totalNum').textContent = total;
    document.getElementById('botNum').textContent = botCount;
    document.getElementById('humanNum').textContent = humanCount;

    // 访客类型明细（按 UA 归类计数）
    var uaMap = {};
    rows.forEach(function(r){
      var key = shortUA(r.user_agent);
      var cat = r.category === 'bot' ? 'bot' : 'human';
      if(!uaMap[key]) uaMap[key] = {count:0, cat:cat};
      uaMap[key].count++;
    });
    var uaArr = Object.keys(uaMap).map(function(k){ return {name:k, count:uaMap[k].count, cat:uaMap[k].cat}; });
    uaArr.sort(function(a,b){ return b.count - a.count; });

    var botHtml = '<table><tr><th>访客类型</th><th>分类</th><th>次数</th></tr>';
    uaArr.forEach(function(u){
      botHtml += '<tr><td>'+u.name+'</td><td><span class="tag '+u.cat+'">'+(u.cat==='bot'?'机器':'真人')+'</span></td><td>'+u.count+'</td></tr>';
    });
    botHtml += '</table>';
    if(uaArr.length === 0) botHtml = '<div class="empty">暂无数据</div>';
    document.getElementById('botList').innerHTML = botHtml;

    // 最近记录
    var recent = rows.slice(0, 20);
    var recentHtml = '<table><tr><th>时间</th><th>类型</th><th>页面</th><th>UA</th></tr>';
    recent.forEach(function(r){
      var cat = r.category === 'bot' ? 'bot' : 'human';
      recentHtml += '<tr><td>'+fmtTime(r.created_at)+'</td><td><span class="tag '+cat+'">'+(cat==='bot'?'机器':'真人')+'</span></td><td>'+((r.page||'/'))+'</td><td>'+shortUA(r.user_agent)+'</td></tr>';
    });
    recentHtml += '</table>';
    if(recent.length === 0) recentHtml = '<div class="empty">暂无数据</div>';
    document.getElementById('recentList').innerHTML = recentHtml;

  }catch(e){
    document.getElementById('botList').innerHTML = '<div class="empty">加载失败：'+e.message+'</div>';
    document.getElementById('recentList').innerHTML = '<div class="empty">加载失败：'+e.message+'</div>';
  }
}

load();
</script>
</body>
</html>
